name: Yearly zones NIFTY 50

on:
  workflow_dispatch:
    inputs:
      auto_adjust:
        description: 'yfinance auto_adjust (true/false)'
        default: 'true'

jobs:
  yearly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan yearly zones
        env:
          AUTO_ADJUST: ${{ github.event.inputs.auto_adjust || 'true' }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          import yfinance as yf
          from zone_agent.zones import find_zones

          NIFTY50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO",
            "BAJAJFINSV","BAJFINANCE","BEL","BHARTIARTL","BPCL","BRITANNIA","CIPLA",
            "COALINDIA","DRREDDY","EICHERMOT","ETERNAL","GRASIM","HCLTECH","HDFCBANK",
            "HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","INDUSINDBK",
            "INFY","ITC","JSWSTEEL","KOTAKBANK","LT","M&M","MARUTI","NESTLEIND",
            "NTPC","ONGC","POWERGRID","RELIANCE","SBILIFE","SBIN","SHRIRAMFIN",
            "SUNPHARMA","TATACONSUM","TATAMOTORS","TATASTEEL","TCS","TECHM","TITAN",
            "TRENT","ULTRACEMCO","WIPRO"]
          tickers = [t + ".NS" for t in NIFTY50]
          # symbols whose candles are printed to the log for manual chart checks
          CHECK = {"INFY","ITC","M&M","GRASIM","TATASTEEL","BEL","ADANIPORTS","ULTRACEMCO","WIPRO","ICICIBANK"}
          raw = yf.download(tickers, period="max", interval="1mo", group_by="ticker",
                            auto_adjust=os.environ.get('AUTO_ADJUST','true')=='true', progress=False, threads=True)
          rows = []
          for t in tickers:
              try:
                  m = raw[t][["Open","High","Low","Close"]].dropna()
              except Exception:
                  print("no data", t); continue
              if len(m) < 24:
                  continue
              m.index = pd.to_datetime(m.index).tz_localize(None)
              agg = {"Open":"first","High":"max","Low":"min","Close":"last"}
              yearly = m.resample("YE").agg(agg).dropna()
              # half-year: Jan-Jun and Jul-Dec buckets from monthly candles
              key = m.index.year * 2 + (m.index.month > 6).astype(int)
              half = m.groupby(key).agg(agg).dropna()
              half.index = m.groupby(key).apply(lambda g: g.index[-1]).reindex(half.index)
              for tf, y in (("yearly", yearly), ("halfyear", half)):
                  if t.replace(".NS","") in CHECK:
                      print(f"CANDLES {tf} {t}")
                      print(y[y.index.year >= 2019].round(2).to_string())
                  zones, _ = find_zones(y, require_high_break=True)
                  for z in zones:
                      rows.append({
                          "timeframe": tf,
                          "symbol": t.replace(".NS",""), "kind": z.kind, "pattern": z.pattern,
                          "base_period": f"{y.index[z.base_start].date()}..{y.index[z.base_end].date()}",
                          "legout_period": str(y.index[z.legout_idx].date()),
                          "proximal": round(float(z.proximal),2), "distal": round(float(z.distal),2),
                          "base_candles": z.base_count, "tests": z.tests,
                          "breached": z.breached, "in_zone_now": z.in_zone_now,
                          "last_close": round(float(y["Close"].iloc[-1]),2),
                      })
          out = pd.DataFrame(rows)
          os.makedirs("reports/yearly", exist_ok=True)
          out.to_csv("reports/yearly/yearly_zones.csv", index=False)
          print("TOTAL ZONES", len(out))
          print(out.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yearly-zones
          path: reports/yearly/
