name: Fresh DBR zones NIFTY 50 (monthly, quarterly, half-year, yearly)

on:
  workflow_dispatch:
    inputs:
      auto_adjust:
        description: 'yfinance auto_adjust (true/false)'
        default: 'false'

jobs:
  zones:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan fresh DBR zones
        env:
          AUTO_ADJUST: ${{ github.event.inputs.auto_adjust || 'false' }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          import yfinance as yf
          from zone_agent.zones import find_zones

          NIFTY50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO",
            "BAJAJFINSV","BAJFINANCE","BEL","BHARTIARTL","BPCL","BRITANNIA","CIPLA",
            "COALINDIA","DRREDDY","EICHERMOT","ETERNAL","GRASIM","HCLTECH","HDFCBANK",
            "HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","INDUSINDBK",
            "INFY","ITC","JSWSTEEL","KOTAKBANK","LT","M&M","MARUTI","NESTLEIND",
            "NTPC","ONGC","POWERGRID","RELIANCE","SBILIFE","SBIN","SHRIRAMFIN",
            "SUNPHARMA","TATACONSUM","TATAMOTORS","TATASTEEL","TCS","TECHM","TITAN",
            "TRENT","ULTRACEMCO","WIPRO"]
          tickers = [t + ".NS" for t in NIFTY50]
          auto = os.environ.get("AUTO_ADJUST", "false") == "true"
          raw = yf.download(tickers, period="max", interval="1mo", group_by="ticker",
                            auto_adjust=auto, progress=False, threads=True)
          today = pd.Timestamp.now().normalize()
          agg = {"Open":"first","High":"max","Low":"min","Close":"last"}
          rows = []
          for t in tickers:
              try:
                  m = raw[t][["Open","High","Low","Close"]].dropna()
              except Exception:
                  print("no data", t); continue
              if len(m) < 24:
                  continue
              m.index = pd.to_datetime(m.index).tz_localize(None)
              # only fully closed months
              m = m[m.index < pd.Timestamp(today.year, today.month, 1)]
              frames = {"monthly": m}
              yr = m.resample("YE").agg(agg).dropna()
              frames["yearly"] = yr[yr.index.year < today.year]
              key = m.index.year * 2 + (m.index.month > 6).astype(int)
              hf = m.groupby(key).agg(agg).dropna()
              hf.index = m.groupby(key).apply(lambda g: g.index[-1]).reindex(hf.index)
              cur_h = today.year * 2 + int(today.month > 6)
              frames["halfyear"] = hf[(hf.index.year * 2 + (hf.index.month > 6).astype(int)) < cur_h]
              qt = m.resample("QE").agg(agg).dropna()
              frames["quarterly"] = qt[qt.index < today.to_period("Q").end_time.normalize()]
              for tf, y in frames.items():
                  if len(y) < 8:
                      continue
                  red = (y["Close"] < y["Open"]).to_numpy()
                  low = y["Low"].to_numpy()
                  zones, _ = find_zones(y, require_high_break=True)
                  for z in zones:
                      # fresh only: never touched, not breached, not inside now
                      if z.tests != 0 or z.breached or z.in_zone_now:
                          continue
                      s = z.legin_idx
                      while s - 1 >= 0 and red[s - 1]:
                          s -= 1
                      setup_low = float(low[s:z.base_end + 1].min())
                      broken = bool((low[z.legout_idx + 1:] < setup_low).any())
                      rows.append({
                          "timeframe": tf, "symbol": t.replace(".NS",""),
                          "kind": z.kind, "pattern": z.pattern,
                          "base_period": f"{y.index[z.base_start].date()}..{y.index[z.base_end].date()}",
                          "legout_period": str(y.index[z.legout_idx].date()),
                          "proximal": round(float(z.proximal), 2), "distal": round(float(z.distal), 2),
                          "setup_low": round(setup_low, 2), "setup_broken": broken,
                          "base_candles": z.base_count,
                          "last_closed": round(float(y["Close"].iloc[-1]), 2),
                      })
          out = pd.DataFrame(rows)
          os.makedirs("reports/fresh", exist_ok=True)
          out.to_csv("reports/fresh/fresh_zones.csv", index=False)
          print("TOTAL FRESH ZONES", len(out))
          print(out.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-zones
          path: reports/fresh/
