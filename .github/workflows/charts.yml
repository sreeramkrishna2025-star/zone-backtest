name: Trade charts

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'SYMBOL:ENTRY_DATE:EXIT_DATE:ENTRY:SL ...'
        required: true

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Draw
        env:
          ARGS: ${{ github.event.inputs.args }}
        run: python plot_trades.py $ARGS
      - name: Commit charts
        run: |
          git config user.name "zone-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add charts
          git commit -m "Trade charts" || echo nothing
          git pull --rebase -q && git push
