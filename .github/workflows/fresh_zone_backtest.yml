name: Fresh DBR zone backtest NIFTY 50

on:
  workflow_dispatch:
    inputs:
      auto_adjust:
        description: 'yfinance auto_adjust (true/false)'
        default: 'false'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fresh zone backtest
        env:
          AUTO_ADJUST: ${{ github.event.inputs.auto_adjust || 'false' }}
        run: python fresh_zone_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-zone-backtest
          path: reports/fresh_backtest/
