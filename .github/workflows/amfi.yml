name: Fetch AMFI market-cap ranks
on: workflow_dispatch
permissions:
  contents: write
jobs:
  amfi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl xlrd requests
      - run: python tools/fetch_amfi.py
      - name: Commit
        run: |
          git config user.name "zone-agent-bot"
          git config user.email "zone-agent-bot@users.noreply.github.com"
          git add data/amfi || true
          git commit -m "AMFI ranks" || exit 0
          git pull --rebase -q && git push
