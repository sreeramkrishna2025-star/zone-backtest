name: DBR NIFTY 50 backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: DBR backtest on NIFTY 50
        run: python dbr_nifty50_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: dbr-nifty50-report
          path: reports/dbr/
